const posColor = "#97C459";
const negColor = "#F09595";
const hlColor  = "#EF9F27";

function getColor(w) {
  if (w.cat === 2) return hlColor;
  return w.cat === 1 ? posColor : negColor;
}

const canvas = document.getElementById("wc-canvas");
const tip = document.getElementById("tooltip");
const ctx = canvas.getContext("2d");

let W, H, placedWords = [];

function layout() {
  const wrap = document.getElementById("wc-wrap");
  W = wrap.clientWidth || 600;
  H = Math.max(480, Math.round(W * 0.72));
  canvas.width = W;
  canvas.height = H;
  wrap.style.minHeight = H + "px";

  const freqs = words.map(w => w.freq);
  const minF = Math.min(...freqs), maxF = Math.max(...freqs);

  function fontSize(f) {
    const t = (f - minF) / (maxF - minF);
    return Math.round(12 + t * (W < 500 ? 26 : 34));
  }

  placedWords = [];
  const occupied = [];

  function overlaps(ax, ay, aw, ah) {
    for (const r of occupied) {
      if (ax < r.x + r.w + 4 && ax + aw + 4 > r.x && ay < r.y + r.h + 4 && ay + ah + 4 > r.y) return true;
    }
    return false;
  }

  const cx = W / 2, cy = H / 2;
  const sorted = [...words].sort((a, b) => b.freq - a.freq);

  for (const word of sorted) {
    const fs = fontSize(word.freq);
    const fw = word.cat === 2 ? "500" : "400";
    ctx.font = `${fw} ${fs}px sans-serif`;
    const metrics = ctx.measureText(word.text);
    const ww = metrics.width;
    const wh = fs * 1.2;

    let placed = false;
    for (let r = 0; r < Math.max(W, H) * 1.5; r += 3) {
      const angle = r * 0.18 + (word.cat === 0 ? Math.PI : 0);
      const px = cx + r * Math.cos(angle) - ww / 2;
      const py = cy + r * Math.sin(angle) * 0.72 + wh / 2;
      const margin = 10;
      if (px < margin || px + ww > W - margin || py - wh < margin || py > H - margin) continue;
      if (!overlaps(px, py - wh, ww, wh)) {
        placedWords.push({ word, x: px, y: py - wh, w: ww, h: wh, cx: px + ww / 2, cy: py, fs, fw });
        occupied.push({ x: px, y: py - wh, w: ww, h: wh });
        placed = true;
        break;
      }
    }
    if (!placed) {
      let px, py;
      let attempts = 0;
      do {
        px = margin + Math.random() * (W - ww - 2 * margin);
        py = margin + wh + Math.random() * (H - wh - 2 * margin);
        attempts++;
      } while (overlaps(px, py - wh, ww, wh) && attempts < 200);
      placedWords.push({ word, x: px, y: py - wh, w: ww, h: wh, cx: px + ww / 2, cy: py, fs, fw });
      occupied.push({ x: px, y: py - wh, w: ww, h: wh });
    }
  }
  redraw(-1);
}

function redraw(hoverIdx) {
  ctx.clearRect(0, 0, W, H);
  const freqs = words.map(w => w.freq);
  const minF = Math.min(...freqs), maxF = Math.max(...freqs);

  placedWords.forEach((p, i) => {
    const isHover = i === hoverIdx;
    ctx.font = `${p.fw} ${p.fs}px sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    const range = maxF - minF || 1;
    const baseAlpha = p.word.cat === 2 ? 1 : (0.72 + 0.28 * ((p.word.freq - minF) / range));
    ctx.globalAlpha = isHover ? 1 : baseAlpha;
    ctx.fillStyle = getColor(p.word);
    if (isHover) {
      ctx.save();
      ctx.translate(p.cx, p.cy);
      ctx.scale(1.08, 1.08);
      ctx.fillText(p.word.text, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(p.word.text, p.cx, p.cy);
    }
    if (p.word.cat === 2) {
      ctx.globalAlpha = isHover ? 0.85 : 0.45;
      ctx.strokeStyle = hlColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(p.x - 3, p.y - 2, p.w + 6, p.h + 4, 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

let currentHover = -1;
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  let found = -1;
  for (let i = 0; i < placedWords.length; i++) {
    const p = placedWords[i];
    if (mx >= p.x - 3 && mx <= p.x + p.w + 3 && my >= p.y - 2 && my <= p.y + p.h + 2) { found = i; break; }
  }
  if (found !== currentHover) {
    currentHover = found;
    redraw(currentHover);
    if (found >= 0) {
      canvas.style.cursor = "pointer";
      const p = placedWords[found];
      const scaleBack = rect.width / W;
      const tx = Math.min(p.x * scaleBack, rect.width - 230);
      const ty = (p.y + p.h) * scaleBack + 8 > rect.height - 80 ? (p.y - 90) * scaleBack : (p.y + p.h) * scaleBack + 8;
      tip.innerHTML = `<strong>${p.word.text}</strong>${p.word.context}`;
      tip.style.left = tx + "px";
      tip.style.top = ty + "px";
      tip.style.opacity = "1";
    } else {
      canvas.style.cursor = "default";
      tip.style.opacity = "0";
    }
  }
});
canvas.addEventListener("mouseleave", () => {
  currentHover = -1;
  redraw(-1);
  tip.style.opacity = "0";
});

window.addEventListener("resize", () => { layout(); });
layout();
</script>
