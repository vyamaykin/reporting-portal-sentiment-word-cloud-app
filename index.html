function wordsForTab(id) {
  if (id === "all") return allWords;
  return allWords.filter(w => {
    const s = w.session;
    return s === id || s === "all" || s.split("+").includes(id);
  });
}

function updateSentiment(words) {
  let pos = 0, neg = 0, req = 0;
  words.forEach(w => {
    if (w.cat === 1) pos += w.freq;
    else if (w.cat === 0) neg += w.freq;
    else req += w.freq;
  });
  const total = pos + neg + req || 1;
  const pp = Math.round(pos / total * 100);
  const np = Math.round(neg / total * 100);
  const rp = 100 - pp - np;
  document.getElementById("bar-pos").style.width = pp + "%";
  document.getElementById("bar-neg").style.width = np + "%";
  document.getElementById("bar-req").style.width = rp + "%";
  document.getElementById("pct-pos").textContent = pp + "%";
  document.getElementById("pct-neg").textContent = np + "%";
  document.getElementById("pct-req").textContent = rp + "%";
  document.getElementById("sent-counts").textContent = words.length + " terms";
}

let activeTab = "all";
const tabRow = document.getElementById("tab-row");

TABS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "tab" + (t.id === "all" ? " active" : "");
  const inner = document.createElement("div");
  inner.className = "tab-inner";
  const title = document.createElement("div");
  title.className = "tab-title";
  title.textContent = t.label;
  const sub = document.createElement("div");
  sub.className = "tab-sub";
  sub.textContent = t.sub;
  const count = document.createElement("div");
  count.className = "tab-count";
  count.textContent = t.count;
  inner.appendChild(title);
  inner.appendChild(sub);
  inner.appendChild(count);
  btn.appendChild(inner);
  btn.addEventListener("click", () => {
    if (activeTab === t.id) return;
    activeTab = t.id;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentWords = wordsForTab(activeTab);
    updateSentiment(currentWords);
    layout(currentWords);
  });
  tabRow.appendChild(btn);
});

const posColor = "#97C459", negColor = "#F09595", hlColor = "#EF9F27";
function getColor(w) { return w.cat === 2 ? hlColor : w.cat === 1 ? posColor : negColor; }

const canvas = document.getElementById("wc-canvas");
const tip    = document.getElementById("tooltip");
const ctx    = canvas.getContext("2d");
let W, H, placedWords = [], currentWords = allWords;

function layout(words) {
  const wrap = document.getElementById("wc-wrap");
  W = wrap.clientWidth || 600;
  H = Math.max(460, Math.round(W * 0.7));
  canvas.width = W; canvas.height = H;
  wrap.style.minHeight = H + "px";

  const freqs = words.map(w => w.freq);
  const minF = Math.min(...freqs), maxF = Math.max(...freqs);
  const margin = 10;

  function fontSize(f) {
    const t = (f - minF) / (maxF - minF || 1);
    return Math.round(12 + t * (W < 500 ? 24 : 32));
  }

  placedWords = [];
  const occupied = [];

  function overlaps(ax, ay, aw, ah) {
    for (const r of occupied) {
      if (ax < r.x+r.w+5 && ax+aw+5 > r.x && ay < r.y+r.h+5 && ay+ah+5 > r.y) return true;
    }
    return false;
  }

  const cx = W/2, cy = H/2;
  const sorted = [...words].sort((a,b) => b.freq - a.freq);

  for (const word of sorted) {
    const fs = fontSize(word.freq);
    const fw = word.cat === 2 ? "500" : "400";
    ctx.font = `${fw} ${fs}px sans-serif`;
    const ww = ctx.measureText(word.text).width;
    const wh = fs * 1.25;
    let placed = false;

    for (let r = 0; r < Math.max(W,H)*1.6; r += 2.5) {
      const angle = r * 0.17 + (word.cat === 0 ? Math.PI*0.6 : 0);
      const px = cx + r*Math.cos(angle) - ww/2;
      const py = cy + r*Math.sin(angle)*0.7 + wh/2;
      if (px<margin || px+ww>W-margin || py-wh<margin || py>H-margin) continue;
      if (!overlaps(px, py-wh, ww, wh)) {
        placedWords.push({word, x:px, y:py-wh, w:ww, h:wh, cx:px+ww/2, cy:py, fs, fw});
        occupied.push({x:px, y:py-wh, w:ww, h:wh});
        placed = true; break;
      }
    }
    if (!placed) {
      let px, py, attempts = 0;
      do {
        px = margin + Math.random()*(W-ww-2*margin);
        py = margin + wh + Math.random()*(H-wh-2*margin);
        attempts++;
      } while (overlaps(px, py-wh, ww, wh) && attempts < 300);
      placedWords.push({word, x:px, y:py-wh, w:ww, h:wh, cx:px+ww/2, cy:py, fs, fw});
      occupied.push({x:px, y:py-wh, w:ww, h:wh});
    }
  }
  redraw(-1, words);
}

function redraw(hoverIdx, words) {
  ctx.clearRect(0, 0, W, H);
  const freqs = (words||allWords).map(w=>w.freq);
  const minF = Math.min(...freqs), maxF = Math.max(...freqs);
  const range = maxF - minF || 1;

  placedWords.forEach((p, i) => {
    const isHover = i === hoverIdx;
    ctx.font = `${p.fw} ${p.fs}px sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const baseAlpha = p.word.cat === 2 ? 1 : (0.65 + 0.35*((p.word.freq-minF)/range));
    ctx.globalAlpha = isHover ? 1 : baseAlpha;
    ctx.fillStyle = getColor(p.word);
    if (isHover) {
      ctx.save(); ctx.translate(p.cx, p.cy); ctx.scale(1.07,1.07);
      ctx.fillText(p.word.text, 0, 0); ctx.restore();
    } else {
      ctx.fillText(p.word.text, p.cx, p.cy);
    }
    if (p.word.cat === 2) {
      ctx.globalAlpha = isHover ? 0.9 : 0.4;
      ctx.strokeStyle = hlColor; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(p.x-4, p.y-2, p.w+8, p.h+4, 4); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

let currentHover = -1;

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX-rect.left)*(W/rect.width);
  const my = (e.clientY-rect.top)*(H/rect.height);
  let found = -1;
  for (let i = 0; i < placedWords.length; i++) {
    const p = placedWords[i];
    if (mx>=p.x-4 && mx<=p.x+p.w+4 && my>=p.y-3 && my<=p.y+p.h+3) { found=i; break; }
  }
  if (found !== currentHover) {
    currentHover = found;
    redraw(currentHover, currentWords);
    if (found >= 0) {
      canvas.style.cursor = "pointer";
      const p = placedWords[found];
      const sb = rect.width/W;
      const tx = Math.min(p.x*sb, rect.width-250);
      const ty = (p.y+p.h)*sb+10 > rect.height-90 ? (p.y-105)*sb : (p.y+p.h)*sb+10;
      const sessLabel = SESSION_LABEL[p.word.session] || p.word.session;
      tip.innerHTML = `<strong>${p.word.text}</strong>${p.word.context}<div class="tip-session">${sessLabel}</div>`;
      tip.style.left = tx+"px"; tip.style.top = ty+"px"; tip.style.opacity = "1";
    } else {
      canvas.style.cursor = "default"; tip.style.opacity = "0";
    }
  }
});

canvas.addEventListener("mouseleave", () => {
  currentHover = -1; redraw(-1, currentWords); tip.style.opacity = "0";
});

window.addEventListener("resize", () => { layout(currentWords); });

currentWords = wordsForTab(activeTab);
updateSentiment(currentWords);
layout(currentWords);
</script>
