<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting Portal Feedback — Sentiment Word Cloud</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: "Segoe UI", system-ui, sans-serif; padding: 24px 16px 40px; min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 600; color: #f0f0f0; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #666; text-align: center; margin-bottom: 20px; }

  /* ── TABS ── */
  .tab-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .tab-btn {
    background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
    padding: 8px 18px; cursor: pointer; text-align: center; transition: all .18s;
    min-width: 120px;
  }
  .tab-btn:hover { border-color: #555; background: #252525; }
  .tab-btn.active { background: #2a2a2a; border-color: #888; }
  .tab-label { font-size: 13px; font-weight: 600; color: #e0e0e0; }
  .tab-sub   { font-size: 11px; color: #666; margin-top: 2px; }

  /* ── SENTIMENT BAR ── */
  .sent-wrap { margin: 0 auto 18px; max-width: 640px; }
  .sent-bar  { display: flex; height: 8px; border-radius: 4px; overflow: hidden; }
  .sent-seg  { transition: width .35s ease; }
  .sent-pcts { display: flex; justify-content: center; gap: 22px; margin-top: 7px; }
  .pct-item  { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #aaa; }
  .pct-dot   { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .pct-val   { font-weight: 700; color: #e0e0e0; }

  /* ── CANVAS WRAP ── */
  #wc-wrap { position: relative; width: 100%; max-width: 860px; margin: 0 auto; }
  #wc-canvas { display: block; width: 100%; cursor: default; border-radius: 12px; background: #161616; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed; background: #222; border: 1px solid #444;
    border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #bbb;
    pointer-events: none; opacity: 0; transition: opacity .15s;
    max-width: 240px; line-height: 1.55; z-index: 99;
  }
  #tooltip strong { display: block; font-size: 13px; font-weight: 600; color: #f0f0f0; margin-bottom: 4px; }
  .tip-session { margin-top: 6px; font-size: 11px; color: #666; }

  /* ── LEGEND ── */
  .wc-legend {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    padding: 14px 0 0; font-size: 12px; color: #777;
    border-top: 1px solid #222; margin-top: 10px; max-width: 860px; margin-left: auto; margin-right: auto;
  }
  .wc-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .wc-hint { font-size: 11px; color: #555; width: 100%; text-align: center; margin-top: 2px; }
</style>
</head>
<body>

<h1>Reporting Portal — Feedback Themes</h1>
<p class="subtitle">Sentiment word cloud · hover any word for context</p>

<div class="tab-row" id="tabs"></div>

<div class="sent-wrap">
  <div class="sent-bar" id="sent-bar">
    <div class="sent-seg" id="seg-pos" style="background:#6daa3a"></div>
    <div class="sent-seg" id="seg-neg" style="background:#d95f5f"></div>
    <div class="sent-seg" id="seg-req" style="background:#c47f10"></div>
  </div>
  <div class="sent-pcts">
    <span class="pct-item"><span class="pct-dot" style="background:#6daa3a"></span><span class="pct-val" id="pct-pos">—</span>&nbsp;positive</span>
    <span class="pct-item"><span class="pct-dot" style="background:#d95f5f"></span><span class="pct-val" id="pct-neg">—</span>&nbsp;negative</span>
    <span class="pct-item"><span class="pct-dot" style="background:#c47f10; border-radius:2px; width:9px; height:9px;"></span><span class="pct-val" id="pct-req">—</span>&nbsp;needs work ✱</span>
  </div>
</div>

<div id="wc-wrap">
  <canvas id="wc-canvas"></canvas>
  <div id="tooltip"></div>
</div>

<div class="wc-legend">
  <span><span class="wc-dot" style="background:#6daa3a"></span>Positive feedback</span>
  <span><span class="wc-dot" style="background:#d95f5f"></span>Negative feedback</span>
  <span><span class="wc-dot" style="background:#c47f10; border-radius:2px; width:9px; height:9px;"></span>Needs work <strong style="color:#c47f10">✱</strong></span>
  <div class="wc-hint">✱ asterisk marks "needs work" phrases · size = frequency</div>
</div>

<script>
// Session IDs:
//   all = all sessions combined
//   RRM = MERS Regional Managers  (3 participants)
//   MK  = MOKAN                   (2 participants)
//   DM  = DMs                     (4 participants now — added Maria Horn)

const TABS = [
  { id:"all", label:"All Sessions",            sub:"9 participants" },
  { id:"RRM", label:"MERS Regional Managers",  sub:"3 participants" },
  { id:"MK",  label:"MOKAN",                   sub:"2 participants" },
  { id:"DM",  label:"DMs",                     sub:"4 participants" },
];

const SESSION_LABEL = {
  all:      "All sessions",
  RRM:      "MERS Regional Managers",
  MK:       "MOKAN",
  DM:       "DMs",
  "MK+RRM": "MOKAN + MERS Regional Managers",
};

// cat: "pos"=positive  "neg"=negative  "req"=needs-work/request
const allWords = [
  // ── POSITIVE ──
  {text:"helpful",            freq:13, cat:"pos", session:"all",   ctx:"Recurring across all sessions. Thumbnails, view counter, pinning, drill-down, color coding, and the monthly report all called helpful by multiple participants."},
  {text:"great",              freq:11, cat:"pos", session:"all",   ctx:"Consistent praise across all groups — the reports, the layout, and the overall portal experience."},
  {text:"perfect",            freq:9,  cat:"pos", session:"RRM",   ctx:"Used repeatedly when features worked as expected — pinning, multi-select slicers, date range navigation."},
  {text:"fantastic",          freq:8,  cat:"pos", session:"all",   ctx:"Used across sessions to describe report quality and overall portal effort."},
  {text:"cool",               freq:7,  cat:"pos", session:"RRM",   ctx:"Spontaneous reaction to pinning behavior, multi-district filtering, and the live digital signage addition."},
  {text:"easy",               freq:6,  cat:"pos", session:"RRM",   ctx:"Described as 'fairly easy to navigate,' 'looks really easy to navigate,' and 'super easy.'"},
  {text:"i like that",        freq:7,  cat:"pos", session:"all",   ctx:"Kelly S5: 'I like that feature.' Session 6: Lisa: 'I like this right here.' Maria (new DM): 'I like that' for softlines separation and top-3 items sold card."},
  {text:"data driven",        freq:3,  cat:"pos", session:"MK",    ctx:"MOKAN portal enabling a more data-driven culture for district managers."},
  {text:"exciting",           freq:3,  cat:"pos", session:"RRM",   ctx:"Tori's tone on the rollout timeline — 'exciting' to get this to DMs and GMs."},
  {text:"useful",             freq:3,  cat:"pos", session:"RRM",   ctx:"Applied to the view counter for understanding which reports are actually being used vs ignored."},
  {text:"self-explanatory",   freq:2,  cat:"pos", session:"RRM",   ctx:"Portal navigation described as 'pretty self-explanatory' and 'really self-explanatory.'"},
  {text:"eye-catching",       freq:2,  cat:"pos", session:"RRM",   ctx:"The DM comparison chart was 'most eye-catching' — requires less processing than a table."},
  {text:"walkthroughs",       freq:2,  cat:"pos", session:"MK",    ctx:"MOKAN DMs appreciated the guided walkthroughs — reduced onboarding friction."},
  {text:"support",            freq:1,  cat:"pos", session:"RRM",   ctx:"'I am super in support of this' — consolidating all reports into one portal."},
  {text:"good report",        freq:3,  cat:"pos", session:"MK",    ctx:"Sales-by-cashier and monthly/annual retail reports called 'a good report.'"},
  {text:"screenshot",         freq:4,  cat:"pos", session:"DM",    ctx:"Multiple DMs use screenshots to share with store managers — faster than export."},
  {text:"dynamic",            freq:3,  cat:"pos", session:"DM",    ctx:"Time intelligence card updates dynamically when switching YTD/MTD — no manual recalc."},
  {text:"donations by day",   freq:2,  cat:"pos", session:"DM",    ctx:"'I like this' for the average donations by day-of-week chart. Fridays are huge — useful for staffing."},
  {text:"love it",            freq:4,  cat:"pos", session:"RRM",   ctx:"Digital signage on-demand and having one centralized reporting location."},
  {text:"intuitive",          freq:4,  cat:"pos", session:"RRM",   ctx:"Thumbnails help managers recognize reports — 'oh I recognise that screen with all the little dots.'"},
  {text:"confident",          freq:3,  cat:"pos", session:"MK",    ctx:"MOKAN: managers feel more confident going into store visits with portal data."},
  {text:"beneficial",         freq:4,  cat:"pos", session:"MK",    ctx:"MOKAN: 'incredibly beneficial for our district conversations.'"},
  {text:"drill down",         freq:5,  cat:"pos", session:"all",   ctx:"Ability to drill from summary to detail praised as a time-saver across sessions."},
  {text:"so much easier",     freq:4,  cat:"pos", session:"DM",    ctx:"Maria (new): having online sales and in-store sales in one view is 'so much easier' than logging into separate systems."},
  {text:"wonderful",          freq:2,  cat:"pos", session:"DM",    ctx:"Maria: the concept of pulling MERS, AMI, and Lisa reports all into one place — 'That's wonderful.'"},
  {text:"top items sold",     freq:3,  cat:"pos", session:"DM",    ctx:"Maria: 'I do like that' for the top-3 items sold card — helps coaches notice what's selling vs what's on the rack."},
  {text:"neat",               freq:3,  cat:"pos", session:"DM",    ctx:"Maria reacted to the employee productivity insights pane: 'That's neat' and 'Okay, that's neat.'"},
  {text:"excited",            freq:2,  cat:"pos", session:"DM",    ctx:"Maria at close: 'I'm excited to kind of start using it and get familiar with it.'"},
  {text:"softlines separation",freq:3, cat:"pos", session:"DM",    ctx:"Maria: 'I've always liked how you can differentiate between the two [soft lines and hard lines].'"},
  // ── NEGATIVE ──
  {text:"fire hose",          freq:4,  cat:"neg", session:"MK",    ctx:"MOKAN: too much data on one screen — 'like drinking from a fire hose.'"},
  {text:"inaccurate",         freq:3,  cat:"neg", session:"all",   ctx:"Duplicate employee names at geographically impossible store pairs flagged as inaccurate data."},
  {text:"nightmare",          freq:3,  cat:"neg", session:"RRM",   ctx:"Previous manual reporting process described as a nightmare before the portal."},
  {text:"not refreshing",     freq:3,  cat:"neg", session:"all",   ctx:"Date filter on hourly donations report not updating the visual when a new range is selected."},
  {text:"confusing",          freq:5,  cat:"neg", session:"all",   ctx:"Navigation flows and filter sequencing described as confusing by multiple participants."},
  {text:"own calculations",   freq:4,  cat:"neg", session:"DM",    ctx:"'I normally just do my own calculations to get the correct percentage' — portal % not always trusted."},
  {text:"too many clicks",    freq:4,  cat:"neg", session:"DM",    ctx:"MERS is preferred because it's 'just a click versus 5 clicks in AMI.' Portal should reduce clicks to answers."},
  {text:"month to date",      freq:5,  cat:"neg", session:"DM",    ctx:"'Most of the time it's the month-to-date percentages that are off.' Primary source of distrust."},
  {text:"missing a day",      freq:3,  cat:"neg", session:"DM",    ctx:"Data can be missing a full day due to internet outage or data lake lag — not visible to the user."},
  {text:"am I reading this right",freq:3,cat:"neg",session:"DM",   ctx:"'Am I even reading the information right?' — readability concern, especially for AMI vs portal discrepancies."},
  {text:"understaffed",       freq:2,  cat:"neg", session:"DM",    ctx:"Some stores understaffed — production is down, affecting sales. Context for using portal to track."},
  {text:"data lake lag",      freq:3,  cat:"neg", session:"DM",    ctx:"Stores with internet outages can have data arrive a day late, skewing percentages."},
  {text:"not matching",       freq:5,  cat:"neg", session:"all",   ctx:"Percentage discrepancies across sessions — month-to-date % often off vs manual calculation."},
  {text:"conditional formatting",freq:3,cat:"neg",session:"DM",    ctx:"Green conditional formatting missing for stores over 100% goal — confirmed by multiple DMs."},
  {text:"percentages off",    freq:3,  cat:"neg", session:"DM",    ctx:"Maria: saw ~87% in WESA but calculated 84–85% manually — 'is that going to get fixed in this system?'"},
  // ── NEEDS WORK ── (cat:"req")
  {text:"glossary",           freq:6,  cat:"req", session:"all",   ctx:"Multiple sessions: terminology in report headers needs a glossary — especially 'explicit online sales,' 'conversion rate,' 'softlines vs textiles.'"},
  {text:"colors",             freq:8,  cat:"req", session:"all",   ctx:"Color coding for at-a-glance status requested across all groups — red/yellow/green thresholds."},
  {text:"reset filter",       freq:5,  cat:"req", session:"all",   ctx:"Filter ordering is non-obvious — users have to reset before selecting region. Needs UX improvement."},
  {text:"custom dates",       freq:6,  cat:"req", session:"all",   ctx:"Users want to select a custom date range and see it displayed as visible text to confirm the period."},
  {text:"missing",            freq:5,  cat:"req", session:"all",   ctx:"Reset filters button absent; e-com goals missing; conditional formatting missing for 100%+ stores."},
  {text:"LY comparison",      freq:5,  cat:"req", session:"all",   ctx:"Participants want a last-year comparison column or date toggle on the month-end sales report."},
  {text:"average daily",      freq:5,  cat:"req", session:"all",   ctx:"Request to calculate and display average daily donations in portal — removes manual Monday pivot table workflow."},
  {text:"labels",             freq:4,  cat:"req", session:"all",   ctx:"Chart axis labels and column headers need clearer naming in several reports."},
  {text:"blank cashiers",     freq:4,  cat:"req", session:"all",   ctx:"Cashier names missing from sales-by-cashier report — transactions not assigned to a cashier in SAP."},
  {text:"accountability",     freq:3,  cat:"req", session:"all",   ctx:"Participants want the report to support accountability conversations — needs clearer goal vs actual display."},
  {text:"phone numbers",      freq:3,  cat:"req", session:"all",   ctx:"District manager phone numbers appearing in the district name field — should be removed."},
  {text:"transaction time",   freq:3,  cat:"req", session:"all",   ctx:"Request to add average transaction time per cashier (start-of-tender to close) as a KPI."},
  {text:"year over year",     freq:5,  cat:"req", session:"DM",    ctx:"Year-over-year sales & donations used frequently. Appreciated the markup YoY time intelligence card."},
  {text:"one-stop shop",      freq:3,  cat:"req", session:"DM",    ctx:"Goal confirmed: portal working toward replacing MERS, AMI, and Lisa as the single reporting destination."},
  {text:"export",             freq:3,  cat:"req", session:"DM",    ctx:"Vic walked through export-data feature. Users currently prefer screenshots over CSV export."},
  {text:"tab consolidation",  freq:2,  cat:"req", session:"DM",    ctx:"Upright Labs has 'total sales by store' and 'allotted' on separate tabs — combining would help."},
  {text:"poking around",      freq:2,  cat:"req", session:"DM",    ctx:"All DM session attendees said they want to 'find some time to poke around' — exploration needed."},
  {text:"navigation map",     freq:4,  cat:"req", session:"DM",    ctx:"Maria: 'something that would navigate them to where it's going to be in this new portal.' Map of old location → new portal location."},
  {text:"roundup breakdown",  freq:3,  cat:"req", session:"DM",    ctx:"Maria: wants to see individual cashier-level roundup data — which cashiers asked, which didn't. Currently only at store level."},
  {text:"month-to-date view", freq:4,  cat:"req", session:"DM",    ctx:"Maria checks stores weekly and monthly — wants MTD performance visible, not just month-end after close."},
  {text:"terminology guide",  freq:3,  cat:"req", session:"DM",    ctx:"Maria: newer managers need a guide — 'this is where it was, this is where it is currently, this is where we're going.'"},
  {text:"one day select",     freq:2,  cat:"req", session:"DM",    ctx:"Production goal rollup requires selecting one day at a time — Maria asked if she can look back at prior days/weeks."},
];

// ── TAB FILTERING ──
function wordsForTab(id) {
  if (id === "all") return allWords;
  return allWords.filter(w => w.session === id || w.session === "all" || w.session === "MK+RRM" && (id==="MK"||id==="RRM"));
}

// ── SENTIMENT ──
function updateSentiment(words) {
  let pos=0, neg=0, req=0;
  words.forEach(w => {
    if (w.cat==="pos") pos += w.freq;
    else if (w.cat==="neg") neg += w.freq;
    else req += w.freq;
  });
  const total = pos+neg+req || 1;
  const pPos = Math.round(pos/total*100);
  const pNeg = Math.round(neg/total*100);
  const pReq = 100 - pPos - pNeg;
  document.getElementById("seg-pos").style.width = pPos+"%";
  document.getElementById("seg-neg").style.width = pNeg+"%";
  document.getElementById("seg-req").style.width  = pReq+"%";
  document.getElementById("pct-pos").textContent = pPos+"%";
  document.getElementById("pct-neg").textContent = pNeg+"%";
  document.getElementById("pct-req").textContent  = pReq+"%";
}

// ── WORD CLOUD LAYOUT ──
const canvas = document.getElementById("wc-canvas");
const ctx2d  = canvas.getContext("2d");
const tip    = document.getElementById("tooltip");

const COLORS = { pos:"#6daa3a", neg:"#d95f5f", req:"#c47f10" };

let placed = [];
let activeTab = "all";
let currentWords = [];
let currentHover = -1;

function wordLabel(w) {
  // Add asterisk prefix for needs-work words
  return w.cat === "req" ? "✱ " + w.text : w.text;
}

function layout(words) {
  const W = canvas.parentElement.clientWidth;
  const H = Math.max(480, Math.round(W * 0.62));
  canvas.width  = W;
  canvas.height = H;
  placed = [];

  // Sort by freq desc
  const sorted = [...words].sort((a,b) => b.freq - a.freq);
  const maxF   = sorted[0]?.freq || 1;
  const minF   = sorted[sorted.length-1]?.freq || 1;

  const offscreen = document.createElement("canvas");
  offscreen.width  = W;
  offscreen.height = H;
  const octx = offscreen.getContext("2d");

  sorted.forEach(w => {
    const frac  = (w.freq - minF) / (maxF - minF + 1);
    const fsize = Math.round(14 + frac * (W < 500 ? 28 : 38));
    const label = wordLabel(w);
    octx.font   = `${w.freq > 8 ? 700 : 500} ${fsize}px "Segoe UI", system-ui, sans-serif`;
    const msr   = octx.measureText(label);
    const tw    = Math.ceil(msr.width) + 6;
    const th    = fsize + 6;

    let px=W/2, py=H/2, found=false;
    const maxR = Math.max(W, H);
    for (let r=0; r<maxR && !found; r+=3) {
      for (let a=0; a<Math.PI*2 && !found; a+=0.18/(r/30+1)) {
        const cx = W/2 + r * Math.cos(a);
        const cy = H/2 + r * Math.sin(a) * 0.72;
        const x1 = cx - tw/2, y1 = cy - th/2;
        const x2 = cx + tw/2, y2 = cy + th/2;
        if (x1<4||y1<4||x2>W-4||y2>H-4) continue;
        const hit = placed.some(p => !(x2<p.x1||x1>p.x2||y2<p.y1||y1>p.y2));
        if (!hit) { px=cx; py=cy; found=true; }
      }
    }
    placed.push({ x1:px-tw/2, y1:py-th/2, x2:px+tw/2, y2:py+th/2, cx:px, cy:py, fsize, word:w, label });
  });

  redraw(-1, words);
}

function redraw(hovIdx, words) {
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0,0,W,H);
  placed.forEach((p,i) => {
    const col = COLORS[p.word.cat] || "#aaa";
    ctx2d.font = `${p.word.freq > 8 ? 700 : 500} ${p.fsize}px "Segoe UI", system-ui, sans-serif`;
    ctx2d.textAlign    = "center";
    ctx2d.textBaseline = "middle";
    if (i === hovIdx) {
      ctx2d.fillStyle = "#fff";
      ctx2d.shadowColor = col;
      ctx2d.shadowBlur  = 12;
    } else {
      ctx2d.fillStyle   = col;
      ctx2d.globalAlpha = 0.85;
      ctx2d.shadowBlur  = 0;
    }
    ctx2d.fillText(p.label, p.cx, p.cy);
    ctx2d.globalAlpha = 1;
    ctx2d.shadowBlur  = 0;
  });
}

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;

  let found = -1;
  placed.forEach((p,i) => {
    if (mx>=p.x1 && mx<=p.x2 && my>=p.y1 && my<=p.y2) found=i;
  });

  if (found !== currentHover) {
    currentHover = found;
    redraw(found, currentWords);
  }

  if (found >= 0) {
    const p = placed[found];
    canvas.style.cursor = "pointer";
    const sessLabel = SESSION_LABEL[p.word.session] || p.word.session;
    const badge = p.word.cat === "req" ? " <span style='color:#c47f10'>✱ needs work</span>" : "";
    tip.innerHTML = `<strong>${p.word.text}${badge}</strong>${p.word.ctx}<div class="tip-session">${sessLabel} · freq: ${p.word.freq}</div>`;
    tip.style.left    = Math.min(e.clientX + 12, window.innerWidth - 260) + "px";
    tip.style.top     = Math.min(e.clientY + 12, window.innerHeight - 160) + "px";
    tip.style.opacity = "1";
  } else {
    canvas.style.cursor = "default";
    tip.style.opacity   = "0";
  }
});

canvas.addEventListener("mouseleave", () => {
  currentHover = -1;
  redraw(-1, currentWords);
  tip.style.opacity = "0";
});

// ── BUILD TABS ──
const tabRow = document.getElementById("tabs");
TABS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (t.id === "all" ? " active" : "");
  btn.innerHTML = `<div class="tab-label">${t.label}</div><div class="tab-sub">${t.sub}</div>`;
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = t.id;
    currentWords = wordsForTab(t.id);
    updateSentiment(currentWords);
    layout(currentWords);
  });
  tabRow.appendChild(btn);
});

window.addEventListener("resize", () => { layout(currentWords); });

// ── INIT ──
currentWords = wordsForTab(activeTab);
updateSentiment(currentWords);
layout(currentWords);
</script>
</body>
</html>
