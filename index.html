<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting Portal Feedback — Sentiment Word Cloud</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: "Segoe UI", system-ui, sans-serif; padding: 24px 16px 40px; min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 600; color: #f0f0f0; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #555; text-align: center; margin-bottom: 18px; }

  /* ── TABS ── */
  #tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .tab-btn {
    background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; color: #999; font-size: 12px;
    transition: all 0.15s; text-align: center; min-width: 120px;
  }
  .tab-btn:hover { border-color: #555; color: #ccc; }
  .tab-btn.active { background: #2a2a2a; border-color: #666; color: #f0f0f0; }
  .tab-label { font-size: 13px; font-weight: 500; }
  .tab-sub   { font-size: 10px; color: #666; margin-top: 2px; }
  .tab-btn.active .tab-sub { color: #888; }

  /* ── SENTIMENT BAR ── */
  #sent-wrap { margin-bottom: 14px; }
  #sent-bar { display: flex; height: 6px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  #seg-pos { background: #6daa3a; transition: width 0.3s; }
  #seg-neg { background: #d95f5f; transition: width 0.3s; }
  #seg-req { background: #c47f10; transition: width 0.3s; }
  #sent-pcts { display: flex; gap: 16px; justify-content: center; font-size: 11px; color: #666; }
  .pct-item { display: flex; align-items: center; gap: 5px; }
  .pct-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pct-val  { color: #aaa; font-weight: 500; }
  #sent-counts { font-size: 10px; color: #444; text-align: center; margin-top: 5px; }

  /* ── CANVAS ── */
  #wc-wrap { position: relative; width: 100%; min-height: 480px; }
  #wc-canvas { display: block; width: 100%; cursor: default; }

  /* ── TOOLTIP ── */
  #tooltip {
    position: fixed; background: #1e1e1e; border: 1px solid #3a3a3a;
    border-radius: 8px; padding: 10px 13px; font-size: 11.5px; color: #aaa;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    max-width: 220px; line-height: 1.6; z-index: 100;
  }
  #tooltip strong { display: block; font-size: 13px; font-weight: 500; color: #f0f0f0; margin-bottom: 4px; }
  .tip-session { font-size: 10px; color: #555; margin-top: 6px; }

  /* ── LEGEND ── */
  .wc-legend {
    display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 0 0;
    font-size: 12px; color: #666; border-top: 1px solid #222; margin-top: 8px;
    justify-content: center; align-items: center;
  }
  .wc-legend span { display: flex; align-items: center; gap: 6px; }
  .wc-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .wc-hint { font-size: 10px; color: #444; margin-top: 5px; text-align: center; }
</style>
</head>
<body>
<h1>Reporting Portal — Feedback Themes</h1>
<p class="subtitle">Usability sessions across all groups</p>

<div id="tabs"></div>

<div id="sent-wrap">
  <div id="sent-bar">
    <div id="seg-pos" style="width:50%"></div>
    <div id="seg-neg" style="width:25%"></div>
    <div id="seg-req" style="width:25%"></div>
  </div>
  <div id="sent-pcts">
    <span class="pct-item"><span class="pct-dot" style="background:#6daa3a"></span><span class="pct-val" id="pct-pos">—</span><span>positive</span></span>
    <span class="pct-item"><span class="pct-dot" style="background:#d95f5f"></span><span class="pct-val" id="pct-neg">—</span><span>negative</span></span>
    <span class="pct-item"><span class="pct-dot" style="background:#c47f10; border-radius:2px;"></span><span class="pct-val" id="pct-req">—</span><span>needs work</span></span>
  </div>
  <div id="sent-counts"></div>
</div>

<div id="wc-wrap">
  <canvas id="wc-canvas"></canvas>
  <div id="tooltip"></div>
</div>

<div class="wc-legend">
  <span><span class="wc-dot" style="background:#6daa3a"></span>Positive feedback</span>
  <span><span class="wc-dot" style="background:#d95f5f"></span>Negative feedback</span>
  <span><span class="wc-dot" style="background:#c47f10; border-radius:2px; width:9px; height:9px;"></span>✱ Needs work</span>
  <div class="wc-hint">hover any word to read context</div>
</div>

<script>
// Session IDs:
//   all     = all sessions combined
//   RRM     = MERS Regional Managers (3 participants: Tori, Brandy, Alec)
//   MK      = MOKAN                  (3 participants: James, Kelly, Jacob)
//   DM      = DMs                    (4 participants: Angela, Brandy W., Lisa, Maria)
//   MK+RRM  = cross-group word (MOKAN + MERS Regional Managers)

const TABS = [
  { id:"all", label:"All Sessions",            sub:"all groups combined · 10 participants" },
  { id:"RRM", label:"MERS Regional Managers",  sub:"3 participants" },
  { id:"MK",  label:"MOKAN",                   sub:"3 participants" },

const allWords = [
  // ── POSITIVE ──────────────────────────────────────────────────────────────
  {text:"helpful",           freq:14, cat:"pos", session:"all",    ctx:"Recurring across all sessions. Thumbnails, view counter, pinning, drill-down, color coding, and the monthly report all described as helpful by multiple participants."},

  {text:"wonderful",         freq:3,  cat:"pos", session:"DM",     ctx:"DM participants used 'wonderful' when reacting to the digital signage TV dashboard and the production goal rollup."},
  {text:"top items sold",    freq:3,  cat:"pos", session:"DM",     ctx:"DMs expressed enthusiasm about seeing top-selling items at the store and district level — helps with buying and pricing decisions."},
  {text:"neat",              freq:3,  cat:"pos", session:"DM",     ctx:"Used by DM participants reacting to the employee-level drill-down and the closed ADC door detection capability."},
  {text:"excited",           freq:3,  cat:"pos", session:"DM",     ctx:"DM participants said they were excited to share the portal with their store managers and use it for accountability."},
  {text:"softlines separation",freq:3,cat:"pos", session:"DM",     ctx:"DMs praised the separation of softlines vs. hardlines in the production report as a meaningful and actionable distinction."},

  // ── NEGATIVE ──────────────────────────────────────────────────────────────
  {text:"nightmare",         freq:4,  cat:"neg", session:"RRM",    ctx:"Legacy reporting process — exporting, reformatting, emailing — described as a nightmare before the portal."},
  {text:"noise",             freq:4,  cat:"neg", session:"RRM",    ctx:"Too much information on screen at once described as 'noise' by participants who prefer focused views."},
  {text:"slower",            freq:3,  cat:"neg", session:"RRM",    ctx:"Report load time on some pages felt slower than expected, especially when switching between date ranges."},
  {text:"grayed out",        freq:5,  cat:"neg", session:"RRM",    ctx:"Grayed-out filter options when no data exists caused confusion — participants weren't sure if it was a bug or intentional."},
  {text:"confusing",         freq:5,  cat:"neg", session:"MK+RRM", ctx:"Category labels and filter panel layout described as confusing across both MERS and MOKAN sessions."},
  {text:"guessing",          freq:4,  cat:"neg", session:"MK+RRM", ctx:"Without a glossary or tooltips, participants described 'guessing' what metrics meant on first encounter."},
  {text:"irrelevant",        freq:3,  cat:"neg", session:"MK",     ctx:"MOKAN participants felt some report columns showed data irrelevant to their district's operations."},
  {text:"inaccurate",        freq:4,  cat:"neg", session:"MK",     ctx:"MOKAN participants flagged data they expected to see accurately but found inconsistencies — especially in overs/shorts."},
  {text:"fire hose",         freq:3,  cat:"neg", session:"MK",     ctx:"MOKAN participants described the initial portal view as a 'fire hose' — too much data at once without clear hierarchy."},
  {text:"slow Wi-Fi",        freq:2,  cat:"neg", session:"MK",     ctx:"MOKAN participants noted that slow in-store Wi-Fi made portal load times frustrating during store visits."},
  {text:"hidden",            freq:3,  cat:"neg", session:"MK",     ctx:"The export button is tucked behind a hover state and described as hidden. A MOKAN DM: 'It's hidden. Yeah, okay. Yeah.' Not discoverable on first visit."},
  {text:"percentages off",   freq:3,  cat:"neg", session:"DM",     ctx:"DM participants noted that markup percentages didn't match what they expected — caused distrust of the data."},
  {text:"conditional formatting",freq:2,cat:"neg",session:"DM",    ctx:"DMs expected Excel-style conditional formatting on the portal — absence of color rules on key columns felt like a missing feature."},
  {text:"same cashier two stores",freq:3,cat:"neg",session:"DM",   ctx:"DMs noticed the same cashier name appearing at geographically impossible store pairs — data integrity issue in the cashier report."},
  {text:"not refreshing",    freq:2,  cat:"neg", session:"DM",     ctx:"Date filter on hourly donations report not updating the visual when a new range is selected — DMs had to reload."},
  {text:"doesn't mean a lot",freq:2,  cat:"neg", session:"DM",     ctx:"Large cumulative donation totals shown without a daily benchmark feel meaningless — DMs need relative context to act on the number."},

  // ── NEEDS WORK ────────────────────────────────────────────────────────────
  {text:"✱ shortcut",         freq:7, cat:"req", session:"RRM",    ctx:"Multiple participants requested keyboard shortcuts or quick-access bookmarks to jump directly to their most-used reports."},
  {text:"✱ colors",           freq:9, cat:"req", session:"all",    ctx:"Requested across all sessions — color coding on month-end sales (red/yellow/green vs goal) to enable faster at-a-glance status checks."},
  {text:"✱ labels",           freq:5, cat:"req", session:"RRM",    ctx:"Column and axis labels on several reports described as unclear or too abbreviated — participants wanted clearer terminology."},
  {text:"✱ glossary",         freq:6, cat:"req", session:"RRM",    ctx:"Participants requested a built-in glossary for metric definitions — especially for total sales, roundup, and donation fields."},
  {text:"✱ reset filter",     freq:6, cat:"req", session:"MK+RRM", ctx:"Filter reset behavior is non-obvious — users have to reset before selecting a new region/division, which is unintuitive. Requested across MERS and MOKAN."},
  {text:"✱ custom dates",     freq:5, cat:"req", session:"MK+RRM", ctx:"Participants in both groups want to define arbitrary date ranges rather than being limited to preset options."},
  {text:"✱ day-of-week avg",  freq:4, cat:"req", session:"MK",     ctx:"MOKAN participants requested average-by-day-of-week breakdowns to account for traffic patterns and scheduling decisions."},
  {text:"✱ produced vs made", freq:3, cat:"req", session:"MK",     ctx:"MOKAN participants wanted clearer separation between items produced (priced) vs. made (physical output) in the production report."},
  {text:"✱ mobile multi-select",freq:4,cat:"req",session:"MK",     ctx:"On mobile, multi-select filters require holding Ctrl — impossible on a phone. A MOKAN DM: 'I cannot select multiple stores when viewing on my phone.' Needs touch-friendly multi-select."},
  {text:"✱ saved view",       freq:3, cat:"req", session:"MK",     ctx:"A MOKAN DM asked if filter selections (district, date range) can be saved as a default view. Current portal doesn't persist bookmarks the way the old app did."},
  {text:"✱ category grouping",freq:4, cat:"req", session:"MK",     ctx:"Furniture and accessories each have many subcategories but no top-level rollup to select all at once. A MOKAN DM: needed to select each furniture subtype individually to see district furniture data."},
  {text:"✱ cash comments",    freq:3, cat:"req", session:"MK",     ctx:"A MOKAN DM uses register-level notes in Solutions to explain overs/shorts (e.g. counterfeit bill, missed drop). Portal's overs/shorts report doesn't surface those comments — DM checks both apps daily."},
  {text:"✱ apples-to-apples", freq:3, cat:"req", session:"MK",     ctx:"Price and category changes mid-year make YoY comparisons misleading. A MOKAN DM: 'We have new prices, new categories — it's not an apple to apple comparison as it used to be.' Needs a price-version-aware comparison mode."},
  {text:"✱ LY comparison",    freq:4, cat:"req", session:"DM",     ctx:"DMs want last year same-period data alongside current period in the monthly report — key for goal-setting and production benchmarking."},
  {text:"✱ average daily",    freq:4, cat:"req", session:"DM",     ctx:"DMs want average daily donations shown directly — removes the need for manual Monday pivot table calculations."},
  {text:"✱ blank cashiers",   freq:3, cat:"req", session:"DM",     ctx:"Some transactions show no cashier name — DMs can't do accountability checks on those rows. Data pipeline issue."},
  {text:"✱ poking around",    freq:2, cat:"req", session:"DM",     ctx:"DM participants said they need time to 'poke around' the portal — implies onboarding support or a guided tour mode is needed."},
  {text:"✱ navigation map",   freq:4, cat:"req", session:"DM",     ctx:"DMs want a map showing where old reports now live in the new portal — 'this is where it was, this is where it is now.'"},
  {text:"✱ roundup breakdown",freq:3, cat:"req", session:"DM",     ctx:"DMs want cashier-level roundup data — which cashiers asked, which didn't. Currently only visible at store level."},
  {text:"✱ month-to-date view",freq:4,cat:"req", session:"DM",     ctx:"DMs check stores weekly and monthly — want MTD performance visible, not just month-end after close."},
  {text:"✱ terminology guide",freq:3, cat:"req", session:"DM",     ctx:"Newer managers need a guide bridging old report names to new portal locations — especially for managers coming from Solutions."},
  {text:"✱ one day select",   freq:2, cat:"req", session:"DM",     ctx:"Production goal rollup requires selecting one day at a time — DMs asked if they can look back at prior days/weeks more easily."},
];

// ── TAB FILTERING ──────────────────────────────────────────────────────────
function wordsForTab(id) {
  if (id === "all") return allWords;
  return allWords.filter(w => {
    const s = w.session;
    if (s === "all") return true;
    if (s === id) return true;
    if (s === "MK+RRM" && (id === "MK" || id === "RRM")) return true;
    return false;
  });
}

// ── SENTIMENT BAR ──────────────────────────────────────────────────────────
function updateSentiment(words) {
  let pos = 0, neg = 0, req = 0;
  words.forEach(w => {
    if (w.cat === "pos") pos += w.freq;
    else if (w.cat === "neg") neg += w.freq;
    else req += w.freq;
  });
  const total = pos + neg + req || 1;
  const pPos = Math.round(pos / total * 100);
  const pNeg = Math.round(neg / total * 100);
  const pReq = 100 - pPos - pNeg;
  document.getElementById("seg-pos").style.width = pPos + "%";
  document.getElementById("seg-neg").style.width = pNeg + "%";
  document.getElementById("seg-req").style.width = pReq + "%";
  document.getElementById("pct-pos").textContent = pPos + "%";
  document.getElementById("pct-neg").textContent = pNeg + "%";
  document.getElementById("pct-req").textContent = pReq + "%";
  document.getElementById("sent-counts").textContent =
    words.length + " terms · " + SESSION_LABEL[activeTab];
}

// ── WORD CLOUD LAYOUT ──────────────────────────────────────────────────────
const canvas  = document.getElementById("wc-canvas");
const ctx2d   = canvas.getContext("2d");
const tip     = document.getElementById("tooltip");
const COLORS  = { pos: "#6daa3a", neg: "#d95f5f", req: "#c47f10" };

let placed = [], activeTab = "all", currentWords = [], currentHover = -1;

function wordLabel(w) { return w.text; }

function fontSize(freq, minF, maxF, W) {
  const t = (freq - minF) / (maxF - minF || 1);
  return Math.round(11 + t * (W < 500 ? 28 : 38));
}

function measure(w, minF, maxF, W) {
  const fs = fontSize(w.freq, minF, maxF, W);
  ctx2d.font = `${w.cat === "req" ? 500 : 400} ${fs}px "Segoe UI", system-ui, sans-serif`;
  const lbl = wordLabel(w);
  const m = ctx2d.measureText(lbl);
  return { w: m.width + 8, h: fs * 1.25, fs };
}

function overlaps(a, b) {
  return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
}

function layout(words) {
  const wrap = document.getElementById("wc-wrap");
  const W = wrap.clientWidth || 700;
  const H = Math.max(500, Math.round(W * 0.72));
  canvas.width = W; canvas.height = H;
  canvas.style.height = H + "px";
  wrap.style.minHeight = H + "px";

  const freqs = words.map(w => w.freq);
  const minF = Math.min(...freqs), maxF = Math.max(...freqs);

  const sorted = [...words].sort((a, b) => b.freq - a.freq);
  placed = [];

  const cx = W / 2, cy = H / 2;
  const step = 3, angleStep = 0.35;

  for (const word of sorted) {
    const { w: tw, h: th, fs } = measure(word, minF, maxF, W);
    let placed_ok = false;
    let angle = 0, radius = 0;
    for (let attempt = 0; attempt < 2000; attempt++) {
      const x = cx + radius * Math.cos(angle) - tw / 2;
      const y = cy + radius * Math.sin(angle) - th / 2;
      const rect = { x, y, w: tw, h: th };
      if (x >= 4 && y >= 4 && x + tw <= W - 4 && y + th <= H - 4) {
        const collision = placed.some(p => overlaps(p, rect));
        if (!collision) {
          placed.push({ ...rect, word, fs });
          placed_ok = true;
          break;
        }
      }
      angle += angleStep;
      radius += step * 0.035;
    }
    if (!placed_ok) {
      // fallback: place anywhere without overlap check
      placed.push({ x: Math.random() * (W - tw - 8) + 4, y: Math.random() * (H - th - 8) + 4, w: tw, h: th, word, fs });
    }
  }
  redraw(-1, words);
}

function redraw(hoverIdx, words) {
  const W = canvas.width, H = canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  placed.forEach((p, i) => {
    const w = p.word;
    const isHover = i === hoverIdx;
    const color = COLORS[w.cat];
    ctx2d.save();
    if (w.cat === "req") {
      ctx2d.font = `500 ${p.fs}px "Segoe UI", system-ui, sans-serif`;
      ctx2d.fillStyle = isHover ? "#f5a623" : color;
    } else {
      ctx2d.font = `${w.freq > 8 ? 500 : 400} ${p.fs}px "Segoe UI", system-ui, sans-serif`;
      ctx2d.fillStyle = isHover ? (w.cat === "pos" ? "#8dd44a" : "#f07070") : color;
    }
    ctx2d.globalAlpha = isHover ? 1.0 : 0.85;
    ctx2d.fillText(wordLabel(w), p.x + 4, p.y + p.h * 0.78);
    ctx2d.restore();
  });
}

// ── HOVER ─────────────────────────────────────────────────────────────────
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleX;
  let found = -1;
  for (let i = 0; i < placed.length; i++) {
    const p = placed[i];
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h) {
      found = i; break;
    }
  }
  if (found !== currentHover) {
    currentHover = found;
    redraw(found, currentWords);
  }
  if (found >= 0) {
    const p = placed[found];
    canvas.style.cursor = "pointer";
    const badge = p.word.cat === "req" ? " <span style='color:#c47f10'>✱ needs work</span>" : "";
    const sessLabel = SESSION_LABEL[p.word.session] || p.word.session;
    tip.innerHTML = `<strong>${p.word.text}${badge}</strong>${p.word.ctx}<div class="tip-session">${sessLabel} · freq: ${p.word.freq}</div>`;
    tip.style.left    = Math.min(e.clientX + 14, window.innerWidth - 240) + "px";
    tip.style.top     = Math.min(e.clientY + 14, window.innerHeight - 170) + "px";
    tip.style.opacity = "1";
  } else {
    canvas.style.cursor = "default";
    tip.style.opacity   = "0";
  }
});

canvas.addEventListener("mouseleave", () => {
  currentHover = -1;
  redraw(-1, currentWords);
  tip.style.opacity = "0";
});

// ── BUILD TABS ─────────────────────────────────────────────────────────────
const tabRow = document.getElementById("tabs");
TABS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (t.id === "all" ? " active" : "");
  btn.innerHTML = `<div class="tab-label">${t.label}</div><div class="tab-sub">${t.sub}</div>`;
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = t.id;
    currentWords = wordsForTab(t.id);
    updateSentiment(currentWords);
    layout(currentWords);
  });
  tabRow.appendChild(btn);
});

window.addEventListener("resize", () => { layout(currentWords); });

// ── INIT ──────────────────────────────────────────────────────────────────
currentWords = wordsForTab(activeTab);
updateSentiment(currentWords);
layout(currentWords);
</script>
</body>
</html>
